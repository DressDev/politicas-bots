<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Políticas de Privacidade - Meus Bots</title>
    <!-- Biblioteca que converte o Markdown (.md) em código HTML puro na tela -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --bg-color: #2f3136;
            --container-bg: #36393f;
            --text-color: #dcddde;
            --text-muted: #72767d;
            --accent-color: #5865f2;
            --accent-hover: #4752c4;
            --border-color: #202225;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--container-bg);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h1 { color: #fff; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
        .bot-list { list-style: none; padding: 0; margin: 20px 0; }
        .bot-item {
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: bold;
        }
        .bot-item:hover {
            background-color: rgba(255,255,255,0.05);
            border-color: var(--accent-color);
        }
        .hidden { display: none; }
        .btn-back {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .btn-back:hover { background-color: var(--accent-hover); }
        #content-area h1, #content-area h2, #content-area h3 { color: #fff; }
        #content-area a { color: var(--accent-color); text-decoration: none; }
        #content-area a:hover { text-decoration: underline; }
        #content-area ul { padding-left: 20px; }
        #content-area li { margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Tela Inicial: Lista de Bots -->
    <div id="list-view">
        <h1>Políticas de Privacidade dos Bots</h1>
        <p style="color: var(--text-muted);">Selecione um bot abaixo para ler as diretrizes:</p>
        <ul id="bot-links" class="bot-list"></ul>
    </div>

    <!-- Tela Secundária: Exibição do Markdown -->
    <div id="content-view" class="hidden">
        <button class="btn-back" onclick="showList()">← Voltar para a lista</button>
        <div id="content-area"></div>
    </div>
</div>

<script>
    // INDEXAÇÃO AUTOMÁTICA: Sempre que criar um novo arquivo .md na pasta 'politicas/',
    // adicione o nome exato dele (sem o .md) dentro deste array abaixo:
    const BOTS = [
        "exemplo-bot",
        "moderador-central"
    ];

    const botLinks = document.getElementById('bot-links');
    const listView = document.getElementById('list-view');
    const contentView = document.getElementById('content-view');
    const contentArea = document.getElementById('content-area');

    function init() {
        if (BOTS.length === 0) {
            botLinks.innerHTML = '<li style="color: var(--text-muted);">Nenhum bot cadastrado.</li>';
            return;
        }
        BOTS.forEach(botSlug => {
            const li = document.createElement('li');
            li.className = 'bot-item';
            // Converte hífens em espaços e deixa maiúsculo para exibir um nome bonito
            const displayName = botSlug.replace(/-/g, ' ').replace(/(^\w|\s\w)/g, m => m.toUpperCase());
            li.textContent = displayName;
            li.onclick = () => loadPrivacyPolicy(botSlug);
            botLinks.appendChild(li);
        });

        // Permite abrir direto pelo link se contiver a hashtag (ex: seupoint.github.io/#exemplo-bot)
        if(window.location.hash) {
            const hashValue = window.location.hash.replace('#', '');
            if(BOTS.includes(hashValue)) loadPrivacyPolicy(hashValue);
        }
    }

    async function loadPrivacyPolicy(botSlug) {
        try {
            contentArea.innerHTML = "<p>Carregando política de privacidade...</p>";
            showContent();
            window.location.hash = botSlug;

            const response = await fetch(`politicas/${botSlug}.md`);
            if (!response.ok) throw new Error();

            const markdownText = await response.text();
            contentArea.innerHTML = marked.parse(markdownText);
        } catch (error) {
            contentArea.innerHTML = `<p style="color: #ff3333;">Erro: Não encontramos o arquivo "politicas/${botSlug}.md".</p>`;
        }
    }

    function showContent() {
        listView.classList.add('hidden');
        contentView.classList.remove('hidden');
    }

    function showList() {
        listView.classList.remove('hidden');
        contentView.classList.add('hidden');
        window.location.hash = '';
    }

    init();
</script>
</body>
</html>
